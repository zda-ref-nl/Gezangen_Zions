name: Import Zions-Lieder (DE)

# Haalt de Duitse Zions-Lieder op via de LLM/Markdown-API van sdarm.life
# en commit data/zions-lieder/ alleen als er iets veranderd is.
# Gebruikt door de Zions-Lieder-artifact (via de GitHub-connector) en later door gezangen.zda-ref.nl (code in sbl.zda-ref.nl).

on:
  schedule:
    - cron: '17 4 * * 1' # maandag 04:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/import-zions-lieder.py'
      - '.github/workflows/import-zions-lieder.yml'

permissions:
  contents: write

concurrency:
  group: import-zions-lieder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundel ophalen
        run: python3 scripts/import-zions-lieder.py

      - name: Committen als er iets veranderd is
        run: |
          if [ -z "$(git status --porcelain data/zions-lieder)" ]; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/zions-lieder
          git commit -m "data: Zions-Lieder bijgewerkt [skip ci]"
          git push
